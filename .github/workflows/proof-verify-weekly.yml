name: Proof Verify (Weekly)

on:
  schedule:
    - cron: "0 3 * * 0"  # Sunday at 03:00 UTC
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-24.04 # Temporary: remove after Ubuntu 26 integration validation
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Synthetic proof verifier regressions
        run: python3 -m unittest discover -s tests -v

      - name: Validate manifest schema
        run: bash scripts/verify-proof-bundle.sh validate docs/proof

      - name: Check referenced files exist
        run: bash scripts/verify-proof-bundle.sh files docs/proof

      - name: Compute hashes
        id: hashes
        run: |
          hashes="$(bash scripts/verify-proof-bundle.sh hashes docs/proof)"
          {
            echo "HASHES<<EOF"
            printf '%s\n' "$hashes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment hashes on PRs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf '%s\n' '### Proof Verify — Results' '' '**Files & Hashes**' '```'
            printf '%s\n' "${{ steps.hashes.outputs.HASHES }}"
            printf '%s\n' '```'
          } > /tmp/c.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/c.md
