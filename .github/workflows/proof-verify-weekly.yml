name: Proof Verify (Weekly)

on:
  schedule:
    - cron: "0 3 * * 0"  # Sunday at 03:00 UTC
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Validate manifest schema
        run: |
          test -f docs/proof/bundle_manifest.json
          jq -e '.title and .version and (.files|type=="array") and .issuer and .license' docs/proof/bundle_manifest.json

      - name: Check referenced files exist
        run: |
          for f in $(jq -r '.files[]' docs/proof/bundle_manifest.json); do
            [ -f "docs/proof/$f" ] || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Compute hashes
        id: hashes
        run: |
          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in $(jq -r '.files[]' docs/proof/bundle_manifest.json); do
            sha=$(sha256sum "docs/proof/$f" | awk '{print $1}')
            echo "$f  $sha"
          done >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment hashes on PRs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "### Proof Verify — Results\n\n**Files & Hashes**\n\`\`\`\n%s\n\`\`\`\n" "${{ steps.hashes.outputs.HASHES }}" > /tmp/c.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/c.md

