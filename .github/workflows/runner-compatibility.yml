name: Runner Compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record runner environment
        run: |
          cat /etc/os-release
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
      - name: Exercise proof commands against a temporary fixture
        run: |
          for tool in jq curl sha256sum awk gh; do command -v "$tool"; done
          jq --version
          curl --version
          gh --version
          work=$(mktemp -d)
          printf abc > "$work/proof.txt"
          printf '%s\n' '{"title":"Runner fixture","version":"1","files":["proof.txt"],"issuer":"CI fixture","license":"test"}' > "$work/manifest.json"
          jq -e '.title and .version and (.files|type=="array") and .issuer and .license' "$work/manifest.json"
          for f in $(jq -r '.files[]' "$work/manifest.json"); do test -f "$work/$f"; done
          actual=$(sha256sum "$work/proof.txt" | awk '{print $1}')
          test "$actual" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          printf '%s\n' '{}' > "$work/invalid.json"
          if jq -e '.title and .version and (.files|type=="array") and .issuer and .license' "$work/invalid.json"; then
            echo '::error::Invalid fixture accepted'; exit 1
          fi
          # Fixtures never replace docs/proof or establish a production proof pass.
