name: Proof Verify (PR)

on:
  pull_request:
    paths:
      - "docs/proof/**"
      - ".github/workflows/proof-verify-pr.yml"
      - ".github/workflows/proof-verify-weekly.yml"
      - "scripts/verify-proof-bundle.sh"
      - "tests/**"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    outputs:
      hashes_b64: ${{ steps.hashes.outputs.HASHES_B64 }}
    runs-on: ubuntu-24.04 # Temporary: remove after Ubuntu 26 integration validation
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Synthetic proof verifier regressions
        run: python3 -m unittest discover -s tests -v

      - name: Validate manifest schema
        run: bash scripts/verify-proof-bundle.sh validate docs/proof

      - name: Check referenced files exist
        run: bash scripts/verify-proof-bundle.sh files docs/proof

      - name: Compute hashes
        id: hashes
        run: |
          hashes="$(bash scripts/verify-proof-bundle.sh hashes docs/proof)"
          hashes_b64="$(printf '%s' "$hashes" | base64 -w0)"
          echo "HASHES_B64=$hashes_b64" >> "$GITHUB_OUTPUT"

  comment-hashes:
    needs: verify
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Comment results on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HASHES_B64: ${{ needs.verify.outputs.hashes_b64 }}
        run: |
          hashes="$(printf '%s' "$HASHES_B64" | base64 --decode)"
          {
            printf '%s\n' '### Proof Verify — Results' '' '**Files & Hashes**' '~~~'
            printf '%s\n' "$hashes"
            printf '%s\n' '~~~'
          } > /tmp/c.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/c.md
