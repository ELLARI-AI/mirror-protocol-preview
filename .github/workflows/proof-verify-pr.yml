name: Proof Verify (PR)

on:
  pull_request:
    paths:
      - "docs/proof/**"
      - ".github/workflows/proof-verify-pr.yml"
      - ".github/workflows/proof-verify-weekly.yml"
      - "scripts/verify-proof-bundle.sh"
      - "tests/**"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04 # Temporary: remove after Ubuntu 26 integration validation
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Synthetic proof verifier regressions
        run: python3 -m unittest discover -s tests -v

      - name: Validate manifest schema
        run: bash scripts/verify-proof-bundle.sh validate docs/proof

      - name: Check referenced files exist
        run: bash scripts/verify-proof-bundle.sh files docs/proof

      - name: Compute hashes
        id: hashes
        run: |
          hashes="$(bash scripts/verify-proof-bundle.sh hashes docs/proof)"
          {
            echo "HASHES<<EOF"
            printf '%s\n' "$hashes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment results on PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf '%s\n' '### Proof Verify — Results' '' '**Files & Hashes**' '```'
            printf '%s\n' "${{ steps.hashes.outputs.HASHES }}"
            printf '%s\n' '```'
          } > /tmp/c.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/c.md
